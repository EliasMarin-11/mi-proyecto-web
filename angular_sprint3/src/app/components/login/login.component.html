<main class="main-login">
<h2 class="titulo-login">Inicia Sesión</h2>

<div class="contenedor-formulario">
  <form [formGroup]="loginForm" (ngSubmit)="onLogin()" class="formulario-login">

    <div class="grupo-input">
      <input
        type="email"
        formControlName="email"
        placeholder="E-mail"
        class="input-oscuro"
      >
    </div>

    <div class="grupo-input">
      <input
        type="password"
        formControlName="password"
        placeholder="Contraseña"
        class="input-oscuro"
      >
    </div>

    <div class="opciones-login">
      <label class="checkbox-recordar">
        <input type="checkbox"> Seguir conectado
      </label>
      <a routerLink="#" class="link-olvido">¿Has olvidado la contraseña?</a>
    </div>

    <button type="submit" class="btn-entrar" [disabled]="loginForm.invalid">Inicia Sesión</button>

    <div class="enlace-registro">
      <a routerLink="/registro" class="link-subrayado">¿No tienes cuenta? Registrate</a>
    </div>

  </form>
</div>

</main>
