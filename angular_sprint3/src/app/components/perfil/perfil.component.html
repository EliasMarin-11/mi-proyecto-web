<!-- src/app/components/perfil/perfil.component.html -->

<!-- Mensaje de carga mientras Firebase decide -->
<div *ngIf="cargandoAuth" style="text-align: center; padding: 50px;">
  <h2>Verificando sesión...</h2>
</div>

<main class="main-perfil" *ngIf="!cargandoAuth && usuarioActual">
  <div class="perfil-layout-dual">

    <section class="perfil-tarjeta">
      <!-- AVATAR -->
      <div class="perfil-avatar-wrapper" (click)="inputAvatar.click()">
        <img class="perfil-avatar"
             [src]="nuevaFotoPreview || fotoGuardada || 'img/Usuario SINFONDO.png'"
             alt="Avatar">
        <input type="file" #inputAvatar accept="image/*" class="oculto" (change)="onFotoSeleccionada($event)">
      </div>

      <div class="perfil-cabecera">
        <h2 class="perfil-nombre" *ngIf="!editandoNombre" (click)="activarEdicion()" style="cursor: pointer;" title="Haz clic para editar">
          {{ nuevoNombre }} <img src="img/lapiz.png" alt="Editar" style="width: 20px; vertical-align: middle;">
        </h2>

        <input type="text" class="input-dummy" *ngIf="editandoNombre" autofocus
               [(ngModel)]="nuevoNombre" (keyup.enter)="guardarCambios()"
               placeholder="Escribe tu nombre + Enter">
      </div>


      <form class="perfil-formulario" id="form-perfil">
        <div class="form-grupo">
          <label>Correo Electrónico</label>
          <input type="email" id="input-email" class="input-dummy input-oscuro"
                 [value]="emailUsuario" readonly>
        </div>

        <div class="form-grupo">
          <label>Tu plan actual</label>
          <div class="contenedor-plan">
            <div class="etiqueta-plan" id="texto-plan">{{ planUsuario }}</div>
            <button type="button" class="btn-perfil btn-secundario btn-pequeno" id="btn-gestionar-plan" (click)="irAPlanes()">Gestionar</button>
          </div>
        </div>

        <button type="button" class="btn-perfil" id="btn-guardar" (click)="guardarCambios()">Guardar Cambios</button>

        <hr class="perfil-separador">

        <button type="button" class="btn-perfil" id="btn-cambiar-password" (click)="mostrarCamposPassword()">Cambiar Contraseña</button>

        <!-- Novedad: Campos de cambio de contraseña -->
        <div *ngIf="editandoPassword" style="margin-top: 15px;">
          <div class="form-grupo">
            <label>Contraseña Actual</label>
            <input type="password" [(ngModel)]="passActual" name="passActual" class="input-dummy" placeholder="********" required>
          </div>
          <div class="form-grupo">
            <label>Nueva Contraseña</label>
            <input type="password" [(ngModel)]="passNueva" name="passNueva" class="input-dummy" placeholder="********" required minlength="6">
          </div>
          <button type="button" class="btn-perfil" style="background-color: #28a745; margin-top: 10px;" (click)="actualizarPassword()">Confirmar Nueva Contraseña</button>
          <button type="button" class="btn-perfil btn-secundario btn-pequeno" style="margin-top: 5px;" (click)="cancelarEdicionPassword()">Cancelar</button>
        </div>

      </form>

      <div class="perfil-enlaces-inferiores">
        <p>¿Has terminado de cocinar por hoy?</p>
        <a href="javascript:void(0)" id="btn-logout" (click)="cerrarSesion()">Cerrar Sesión</a>
      </div>
    </section>

    <aside class="perfil-aside-recetas">
      <div class="cabecera-aside">
        <h3 class="titulo-mis-recetas">Mis Recetas Creadas ({{misRecetas.length}})</h3>
        <button type="button" class="btn-nueva-receta-aside" id="btn-ir-nueva-receta" (click)="irASubirReceta()">+ Sube otra receta</button>
      </div>

      <div id="contenedor-mis-recetas" class="contenedor-lista-recetas-aside">

        <!-- Si NO tiene recetas -->
        <div *ngIf="misRecetas.length === 0" style="text-align: center; margin-top: 20px; color: #666;">
          <p>Aún no has creado ninguna receta.</p>
          <p>¡Anímate a compartir tus platos favoritos!</p>
        </div>

        <!-- Si SÍ tiene recetas, dibujamos las tarjetas -->
        <div *ngIf="misRecetas.length > 0" style="display: flex; flex-direction: column; gap: 15px;">
          <!-- Iteramos sobre misRecetas y le pasamos los datos al componente tarjeta -->
          <app-tarjeta_receta_vertical
            *ngFor="let receta of misRecetas"
            [recetaData]="receta">
          </app-tarjeta_receta_vertical>
        </div>

      </div>
    </aside>

  </div>
</main>

<!-- Si Firebase resuelve pero el usuario es null (no está logueado), le avisamos -->
<div *ngIf="!cargandoAuth && !usuarioActual" style="text-align: center; padding: 50px;">
  <h2>No has iniciado sesión.</h2>
  <button (click)="cerrarSesion()">Ir al Login</button>
</div>
