<div *ngIf="cargandoAuth" style="text-align: center; padding: 50px;">
  <h2>Verificando sesión...</h2>
</div>

<main class="main-perfil" *ngIf="!cargandoAuth && usuarioActual">
  <div class="perfil-layout-dual">

    <section class="perfil-tarjeta">
      <div class="perfil-avatar-wrapper" (click)="inputAvatar.click()">
        <img class="perfil-avatar"
             [src]="nuevaFotoPreview || fotoGuardada || 'img/Usuario SINFONDO.png'"
             alt="Avatar">
        <input type="file" #inputAvatar accept="image/*" class="oculto" (change)="onFotoSeleccionada($event)">
      </div>

      <div class="perfil-cabecera">
        <h2 class="perfil-nombre" *ngIf="!editandoNombre" (click)="activarEdicion()" style="cursor: pointer;" title="Haz clic para editar">
          {{ nuevoNombre }} <img src="img/lapiz.png" alt="Editar" style="width: 20px; vertical-align: middle;">
        </h2>

        <input type="text" class="input-dummy" *ngIf="editandoNombre" autofocus
               [(ngModel)]="nuevoNombre" (keyup.enter)="guardarCambios()"
               placeholder="Escribe tu nombre + Enter">
      </div>

      <form class="perfil-formulario" id="form-perfil">
        <div class="form-grupo">
          <label>Correo Electrónico</label>
          <input type="email" id="input-email" class="input-dummy input-oscuro"
                 [value]="emailUsuario" readonly>
        </div>

        <div class="form-grupo">
          <label>Tu plan actual</label>
          <div class="contenedor-plan">
            <div class="etiqueta-plan" id="texto-plan">Básico</div>
            <button type="button" class="btn-perfil btn-secundario btn-pequeno" id="btn-gestionar-plan" (click)="irAPlanes()">Gestionar</button>
          </div>
        </div>

        <button type="button" class="btn-perfil" id="btn-guardar" (click)="guardarCambios()">Guardar Cambios</button>

        <hr class="perfil-separador">

        <button type="button" class="btn-perfil" id="btn-cambiar-password" (click)="cambiarPassword()">Cambiar Contraseña</button>
      </form>

      <div class="perfil-enlaces-inferiores">
        <p>¿Has terminado de cocinar por hoy?</p>
        <a href="javascript:void(0)" id="btn-logout" (click)="cerrarSesion()">Cerrar Sesión</a>
      </div>
    </section>

    <aside class="perfil-aside-recetas">
    </aside>

  </div>
</main>

<div *ngIf="!cargandoAuth && !usuarioActual" style="text-align: center; padding: 50px;">
  <h2>No has iniciado sesión.</h2>
  <button (click)="cerrarSesion()">Ir al Login</button>
</div>
