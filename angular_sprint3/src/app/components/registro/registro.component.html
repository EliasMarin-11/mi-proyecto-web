
<main class="main-registro">

  <h2 class="titulo-registro">Crea tu cuenta</h2>

  <div class="contenedor-formulario">
    <form [formGroup]="registroForm" (ngSubmit)="onRegistro()" class="formulario-registro">

      <div class="grupo-input">
        <input type="text" formControlName="nombre" placeholder="Nombre" class="input-oscuro">
      </div>

      <div class="grupo-input">
        <input type="email" formControlName="email" placeholder="E-mail" class="input-oscuro">
      </div>

      <div class="grupo-input grupo-password">
        <input type="password" formControlName="password" placeholder="Contraseña" class="input-oscuro">
      </div>

      <div class="grupo-input grupo-password">
        <input type="password" formControlName="confirmarPassword" placeholder="Repetir Contraseña" class="input-oscuro">
      </div>

      <div class="opciones-registro">
        <label class="checkbox-terminos">
          <input type="checkbox" required> Seguir Conectado
        </label>
      </div>

      <button type="submit" class="btn-registro">Registrarse</button>

      <div class="enlace-login">
        <a routerLink="/login" class="link-subrayado">¿Ya tienes cuenta?</a>
      </div>

    </form>
  </div>

</main>
