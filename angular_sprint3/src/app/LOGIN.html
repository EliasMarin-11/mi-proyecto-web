<div class="container mt-5 mb-5 d-flex justify-content-center">
  <div class="card shadow p-4" style="width: 100%; max-width: 400px;">
    <h3 class="text-center mb-4">Iniciar Sesión</h3>

    <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
      <div class="mb-3">
        <label class="form-label">Correo Electrónico</label>
        <input type="email" formControlName="email" class="form-control" placeholder="Tu email">
      </div>

      <div class="mb-4">
        <label class="form-label">Contraseña</label>
        <input type="password" formControlName="password" class="form-control" placeholder="Tu contraseña">
      </div>

      <button type="submit" class="btn btn-success w-100" [disabled]="loginForm.invalid">Entrar</button>
    </form>
  </div>
</div>
