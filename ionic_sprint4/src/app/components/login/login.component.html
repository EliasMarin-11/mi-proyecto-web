<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-title class="titulo-login ion-text-center">Inicia Sesión</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding main-login">

  <div class="contenedor-formulario">
    <form [formGroup]="loginForm" (ngSubmit)="onLogin()" class="formulario-login">

      <ion-item lines="none" class="grupo-input">
        <ion-input label="E-mail" labelPlacement="floating" type="email" formControlName="email" class="input-oscuro"></ion-input>
      </ion-item>

      <ion-item lines="none" class="grupo-input">
        <ion-input label="Contraseña" labelPlacement="floating" type="password" formControlName="password" class="input-oscuro"></ion-input>
      </ion-item>

      <div class="opciones-login ion-margin-vertical">
        <ion-checkbox labelPlacement="end" justify="start">Seguir conectado</ion-checkbox>
        <a routerLink="#" class="link-olvido">¿Has olvidado la contraseña?</a>
      </div>

      <ion-button type="submit" expand="block" class="btn-entrar" [disabled]="loginForm.invalid">
        Inicia Sesión
      </ion-button>

      <div class="enlace-registro ion-text-center">
        <a routerLink="/registro" class="link-subrayado">¿No tienes cuenta? Regístrate</a>
      </div>

    </form>
  </div>

</ion-content>
