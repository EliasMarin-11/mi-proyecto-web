<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-title class="titulo-registro ion-text-center">Crea tu cuenta</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding main-registro">

  <div class="contenedor-formulario">
    <form [formGroup]="registroForm" (ngSubmit)="onRegistro()" class="formulario-registro">

      <ion-item lines="none" class="grupo-input">
        <ion-input label="Nombre" labelPlacement="floating" type="text" formControlName="nombre" class="input-oscuro"></ion-input>
      </ion-item>

      <ion-item lines="none" class="grupo-input">
        <ion-input label="Apellidos" labelPlacement="floating" type="text" formControlName="apellidos" class="input-oscuro"></ion-input>
      </ion-item>

      <ion-item lines="none" class="grupo-input">
        <ion-input label="E-mail" labelPlacement="floating" type="email" formControlName="email" class="input-oscuro"></ion-input>
      </ion-item>

      <ion-item lines="none" class="grupo-input grupo-password">
        <ion-input label="Contraseña" labelPlacement="floating" type="password" formControlName="password" class="input-oscuro"></ion-input>
      </ion-item>

      <ion-item lines="none" class="grupo-input grupo-password">
        <ion-input label="Repetir Contraseña" labelPlacement="floating" type="password" formControlName="confirmarPassword" class="input-oscuro"></ion-input>
      </ion-item>

      <ion-item lines="none" class="grupo-input ion-margin-top">
        <ion-label position="stacked">Foto de perfil:</ion-label>
        <input type="file" (change)="onFileSelected($event)" accept="image/*">
      </ion-item>

      <div class="opciones-registro ion-margin-vertical">
        <ion-checkbox labelPlacement="end" justify="start">Seguir Conectado</ion-checkbox>
      </div>

      <ion-button type="submit" expand="block" class="btn-registro">Registrarse</ion-button>

      <div class="enlace-login ion-text-center">
        <a routerLink="/login" class="link-subrayado">¿Ya tienes cuenta?</a>
      </div>

    </form>
  </div>

</ion-content>
